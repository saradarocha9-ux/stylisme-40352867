name: Gerar AAB Android

on:
  push:
    branches:
      - release
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-aab:
    name: AAB assinado
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/signing.keystore
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      EXPECTED_ANDROID_SIGNING_SHA1: E0:4D:0C:44:E8:11:A7:AA:5E:3A:05:87:DB:80:43:48:97:F3:87:E5

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android Platform e Build Tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Restaurar chave de upload
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          test -s "$ANDROID_KEYSTORE_PATH"
          chmod 600 "$ANDROID_KEYSTORE_PATH"

      - name: Validar segredos de assinatura
        run: |
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          ACTUAL_SHA1="$(keytool -list -v \
            -keystore "$ANDROID_KEYSTORE_PATH" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" | sed -n 's/^[[:space:]]*SHA1: //p' | head -n 1)"
          if [ "$ACTUAL_SHA1" != "$EXPECTED_ANDROID_SIGNING_SHA1" ]; then
            echo "Erro: o keystore configurado não corresponde à chave de upload exigida pela Play Store."
            echo "SHA-1 esperado: $EXPECTED_ANDROID_SIGNING_SHA1"
            echo "SHA-1 encontrado: $ACTUAL_SHA1"
            exit 1
          fi

      - name: Sincronizar projeto Android
        run: bunx cap sync android

      - name: Configurar cache do Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Gerar AAB release assinado
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - name: Confirmar assinatura do AAB
        run: |
          AAB_PATH="android/app/build/outputs/bundle/release/app-release.aab"
          jarsigner -verify "$AAB_PATH"
          AAB_SHA1="$(keytool -printcert -jarfile "$AAB_PATH" | sed -n 's/^[[:space:]]*SHA1: //p' | head -n 1)"
          if [ "$AAB_SHA1" != "$EXPECTED_ANDROID_SIGNING_SHA1" ]; then
            echo "Erro: o AAB final foi assinado com um certificado incorreto."
            echo "SHA-1 esperado: $EXPECTED_ANDROID_SIGNING_SHA1"
            echo "SHA-1 encontrado: $AAB_SHA1"
            exit 1
          fi

      - name: Publicar AAB como artefato
        uses: actions/upload-artifact@v4
        with:
          name: stylisme-release-aab-${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Apagar chave restaurada
        if: always()
        run: rm -f "$ANDROID_KEYSTORE_PATH"
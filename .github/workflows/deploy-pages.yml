name: Publicar Stylisme no GitHub Pages

on:
  # O aplicativo oficial é publicado em stylisme.company.
  # Mantemos este fluxo apenas manual para impedir que o GitHub Pages seja
  # confundido com o aplicativo Android ou com o site oficial.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Criar redirecionamento para o aplicativo oficial
        run: |
          mkdir -p pages-site
          cp public/icon-192.png public/icon-512.png public/icon-512-maskable.png pages-site/
          cat > pages-site/index.html <<'EOF'
          <!doctype html>
          <html lang="pt-BR">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
              <meta name="theme-color" content="#0b0a09" />
              <meta name="description" content="Stylisme — inteligência para o seu armário." />
              <meta name="robots" content="noindex,follow" />
              <link rel="canonical" href="https://stylisme.company/auth" />
              <link rel="manifest" href="./manifest.webmanifest" />
              <link rel="icon" href="./icon-192.png" />
              <title>Stylisme</title>
              <meta http-equiv="refresh" content="0;url=https://stylisme.company/auth" />
              <style>
                html,body{width:100%;height:100%;margin:0;background:#0b0a09;overflow:hidden}
              </style>
              <script>
                window.location.replace("https://stylisme.company/auth");
              </script>
            </head>
            <body aria-label="Abrindo Stylisme"></body>
          </html>
          EOF
          cp pages-site/index.html pages-site/404.html
          cat > pages-site/manifest.webmanifest <<'EOF'
          {
            "name": "Stylisme — Inteligência para o seu armário",
            "short_name": "Stylisme",
            "description": "Guarda-roupa digital com IA, provador virtual e Stylisme Premium.",
            "id": "https://stylisme.company/",
            "start_url": "https://stylisme.company/auth",
            "scope": "https://stylisme.company/",
            "display": "standalone",
            "orientation": "portrait",
            "background_color": "#F7F2EA",
            "theme_color": "#0b0a09",
            "lang": "pt-BR",
            "icons": [
              { "src": "./icon-192.png", "sizes": "192x192", "type": "image/png", "purpose": "any" },
              { "src": "./icon-512.png", "sizes": "512x512", "type": "image/png", "purpose": "any" },
              { "src": "./icon-512-maskable.png", "sizes": "512x512", "type": "image/png", "purpose": "maskable" }
            ]
          }
          EOF
          touch pages-site/.nojekyll

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Enviar somente os arquivos gerados
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
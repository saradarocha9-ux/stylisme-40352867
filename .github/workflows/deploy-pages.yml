name: Publicar Stylisme no GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Criar entrada PWA para o aplicativo completo
        run: |
          mkdir -p pages-site
          cp public/icon-192.png public/icon-512.png public/icon-512-maskable.png pages-site/
          cat > pages-site/index.html <<'EOF'
          <!doctype html>
          <html lang="pt-BR">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
              <meta name="theme-color" content="#0b0a09" />
              <meta name="description" content="Stylisme — guarda-roupa digital, looks com IA e pagamentos Premium." />
              <link rel="manifest" href="./manifest.webmanifest" />
              <link rel="icon" href="./icon-192.png" />
              <title>Stylisme</title>
              <meta http-equiv="refresh" content="0;url=https://stylisme.company/" />
              <script>window.location.replace("https://stylisme.company/");</script>
            </head>
            <body>
              <p>Abrindo <a href="https://stylisme.company/">Stylisme</a>…</p>
            </body>
          </html>
          EOF
          cat > pages-site/manifest.webmanifest <<'EOF'
          {
            "name": "Stylisme — Inteligência para o seu armário",
            "short_name": "Stylisme",
            "description": "Guarda-roupa digital com IA, provador virtual e Stylisme Premium.",
            "id": "/stylisme-40352867/",
            "start_url": "/stylisme-40352867/",
            "scope": "/stylisme-40352867/",
            "display": "standalone",
            "orientation": "portrait",
            "background_color": "#F7F2EA",
            "theme_color": "#0b0a09",
            "lang": "pt-BR",
            "icons": [
              { "src": "./icon-192.png", "sizes": "192x192", "type": "image/png", "purpose": "any" },
              { "src": "./icon-512.png", "sizes": "512x512", "type": "image/png", "purpose": "any" },
              { "src": "./icon-512-maskable.png", "sizes": "512x512", "type": "image/png", "purpose": "maskable" }
            ]
          }
          EOF
          touch pages-site/.nojekyll

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Enviar somente os arquivos gerados
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
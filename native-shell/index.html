<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Stylisme</title>
    <meta http-equiv="refresh" content="0;url=https://stylisme.company/" />
    <style>
      html,
      body {
        min-height: 100%;
        margin: 0;
        background: #0b0a09;
        color: #f4eee6;
        font-family: serif;
      }

      body {
        display: grid;
        place-items: center;
      }

      main {
        text-align: center;
      }

      h1 {
        margin: 0;
        font-size: 3rem;
        font-weight: 400;
      }

      p {
        margin-top: 1rem;
        font-family: sans-serif;
        font-size: 0.75rem;
        letter-spacing: 0.18rem;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Stylisme</h1>
      <p>Inteligência para o seu armário</p>
    </main>
    <script>
      window.location.replace("https://stylisme.company/");
    </script>
  </body>
</html>
